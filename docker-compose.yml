services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studentvault
      POSTGRES_USER: studentvault
      POSTGRES_PASSWORD: studentvault_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentvault -d studentvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-init:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_data"
    environment: &django-env
      DATABASE_URL: postgresql://studentvault:studentvault_dev_password@db:5432/studentvault
      DJANGO_SECRET_KEY: local-da3-development-key-change-before-deployment
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,nginx
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  backend1:
    build: .
    command: gunicorn student_portfolio.wsgi:application --bind 0.0.0.0:8000 --workers 2
    environment: *django-env
    depends_on:
      app-init:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media

  backend2:
    build: .
    command: gunicorn student_portfolio.wsgi:application --bind 0.0.0.0:8000 --workers 2
    environment: *django-env
    depends_on:
      app-init:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media

  backend3:
    build: .
    command: gunicorn student_portfolio.wsgi:application --bind 0.0.0.0:8000 --workers 2
    environment: *django-env
    depends_on:
      app-init:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/usr/share/nginx/html/media:ro
    depends_on:
      - backend1
      - backend2
      - backend3

volumes:
  postgres_data:
  media_data:
